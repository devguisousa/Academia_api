spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

spring.security.user.name=admin
spring.security.user.password=1234

logging.file.name=logs/academia.log
logging.level.sistema.Academia_api=INFO
# Integração Control iD (credenciais via ambiente)
catraca.url=${CATRACA_URL:http://192.168.1.235}
catraca.usuario=${CATRACA_USUARIO:admin}
catraca.senha=${CATRACA_SENHA:}
catraca.timeout=${CATRACA_TIMEOUT:5s}
